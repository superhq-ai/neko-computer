name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-darwin:
    name: Build CLI (macOS aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p neko --release

      - name: Codesign
        run: codesign --entitlements neko.entitlements --force -s - target/release/neko

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar czf "neko-${VERSION}-darwin-aarch64.tar.gz" -C target/release neko

      - uses: actions/upload-artifact@v4
        with:
          name: cli-darwin
          path: neko-*.tar.gz
          retention-days: 1

  build-linux:
    name: Build CLI (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p neko --release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar czf "neko-${VERSION}-linux-aarch64.tar.gz" -C target/release neko

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: neko-*.tar.gz
          retention-days: 1

  release:
    needs: [build-darwin, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-darwin
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: cli-linux
          path: artifacts/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
